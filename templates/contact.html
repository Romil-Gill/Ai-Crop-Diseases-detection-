{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1><i class="fas fa-envelope-open-text"></i> Contact Our Team</h1>
    <p>Send us a message and our experts will get back to you.</p>
</div>

<div class="contact-card-wrapper">
    <div class="content-card">
        <form id="contactForm" class="contact-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="Describe the issue or provide feedback..." required></textarea>
            </div>

            <button type="submit" class="primary-btn">
                <i class="fas fa-paper-plane"></i> Send Message
            </button>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% endblock %}
