{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1><i class="fas fa-history"></i> Scan History</h1>
    <p>Review your past plant health assessments.</p>
</div>

<div class="history-container">
    <div class="history-actions">
        <button id="clearHistoryBtn" class="secondary-btn">
            <i class="fas fa-trash-alt"></i> Clear All
        </button>
    </div>

    <table class="history-table">
        <thead>
            <tr>
                <th>Date & Time</th>
                <th>Crop</th>
                <th>Diagnosis</th>
                <th>Confidence</th>
            </tr>
        </thead>
        <tbody id="historyBody"></tbody>
    </table>

    <div id="noHistoryMsg" class="hidden">
        <div class="empty-state">
            <i class="fas fa-folder-open"></i>
            <p>No history found. <a href="/detect">Try scanning now.</a></p>
        </div>
    </div>
</div>
{% endblock %}
